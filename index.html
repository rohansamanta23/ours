<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch Together</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--bg:#f7f1e8;--pn:#fffdf8cc;--tx:#1f1a33;--mu:#6f6a85;--ac:#e8552f;--ac2:#fff;--bd:#e7dccd;--g1:#ffd9c9;--g2:#d9d4ff;--ok:#1f9d63;--wn:#c27a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100d1c;--pn:#1b1630cc;--tx:#f3effc;--mu:#a29cc0;--ac:#ff8a66;--ac2:#1a1020;--bd:#2f2850;--g1:#3b1d3f;--g2:#1c2457;--ok:#4fd49a;--wn:#ffc15a}}
:root[data-theme="dark"]{--bg:#100d1c;--pn:#1b1630cc;--tx:#f3effc;--mu:#a29cc0;--ac:#ff8a66;--ac2:#1a1020;--bd:#2f2850;--g1:#3b1d3f;--g2:#1c2457;--ok:#4fd49a;--wn:#ffc15a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 520px at 90% -10%,var(--g1),transparent 70%),radial-gradient(800px 520px at -10% 5%,var(--g2),transparent 70%),var(--bg)}
main{max-width:980px;margin:0 auto;padding:28px 16px 56px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--ac),#8b7bff);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 8px 22px #e8552f40}
h1{font:800 clamp(1.8rem,5vw,2.6rem)/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.03em}
.sub{color:var(--mu);margin:0 0 22px}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:22px;padding:22px;margin-bottom:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 18px 50px #0000001a}
label.k{display:block;font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:18px 0 8px}
.txt{width:100%;background:transparent;color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;font:inherit}
.txt.big{font:800 1.8rem/1.2 "Bricolage Grotesque",ui-monospace,monospace;letter-spacing:.3em;text-transform:uppercase;text-align:center}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:11px 18px;background:var(--ac);color:var(--ac2);transition:transform .12s,opacity .12s}
button:hover{transform:translateY(-1px)}button:active{transform:none}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
.cta{width:100%;margin-top:18px;padding:14px;font-size:1.05rem}
.seg{display:flex;gap:4px;background:#8882;padding:4px;border-radius:16px}
.seg button{flex:1;background:transparent;color:var(--mu);padding:10px 8px}
.seg button.on{background:var(--pn);color:var(--tx);box-shadow:0 2px 10px #0002}
button:focus-visible,input:focus-visible,summary:focus-visible,.drop:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.drop{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;border:2px dashed var(--bd);border-radius:18px;padding:22px;cursor:pointer;transition:border-color .15s}
.drop:hover{border-color:var(--ac)}.drop b{font:700 1.05rem "Bricolage Grotesque",system-ui,sans-serif}.drop span{color:var(--mu);font-size:.9rem;word-break:break-all}
p.h{color:var(--mu);font-size:.9rem;margin:8px 2px 0}
.msg{color:var(--ac);font-weight:600;margin:12px 0 0;min-height:1.3em;font-size:.95rem}
.ticket{margin-top:18px;text-align:center;border:1.5px dashed var(--ac);border-radius:20px;padding:18px;background:linear-gradient(180deg,#ffffff10,transparent)}
.ticket .tl{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.code{font:800 clamp(2.4rem,9vw,3.6rem)/1.1 "Bricolage Grotesque",ui-monospace,monospace;letter-spacing:.28em;margin:6px 0 12px;padding-left:.28em}
.wait{color:var(--mu);margin:14px 0 0;display:flex;gap:8px;justify-content:center;align-items:center}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #1f9d6370}100%{box-shadow:0 0 0 12px #1f9d6300}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#stage{background:#000;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 24px 70px #0000004d}
#stage.theater{position:fixed;inset:0;z-index:99;border-radius:0}
#stage video{width:100%;height:auto;max-height:78vh;display:block;background:#000;object-fit:contain;min-height:200px}
#stage:fullscreen video,#stage.theater video{max-height:100vh;height:100%}
#tap{position:absolute;inset:0;display:none;place-items:center;background:#000a;color:#fff;font:700 1.4rem "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer}
#gc{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:30px 14px 12px;background:linear-gradient(transparent,#000d);color:#fff}
#gc button{padding:7px 13px;background:#ffffff2e;color:#fff}
#gc input{flex:1;min-width:60px;accent-color:#fff}
#gc span{font:12px ui-monospace,Menlo,monospace;min-width:84px;text-align:right}
#toasts{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none;max-width:min(330px,82%)}
.toast{background:#15102bef;color:#fff;border-left:4px solid var(--ac);padding:10px 14px;border-radius:12px;font-size:.92rem;box-shadow:0 10px 28px #0006;animation:tin .28s ease}
.toast.ok{border-color:var(--ok)}.toast.warn{border-color:var(--wn)}
.toast.out{opacity:0;transform:translateX(14px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateX(18px)}}
#bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 4px 0;flex-wrap:wrap}
#who{font-weight:700}#st{color:var(--mu);font-size:.88rem}
#bar button{padding:9px 14px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<div class="brand"><div class="logo">▶</div><h1>Watch Together</h1></div>
<p class="sub">Your own videos, in sync with a friend. Free, private, nothing is uploaded.</p>

<section class="pn" id="setup">
  <label class="k" for="nm" style="margin-top:0">Your name</label>
  <input type="text" id="nm" class="txt" maxlength="20" placeholder="What should your friend call you?" autocomplete="off">
  <div class="seg" style="margin-top:18px"><button id="rHost" class="on">Host a room</button><button id="rGuest">Join a room</button></div>

  <div id="hostBox">
    <label class="k">Video</label>
    <label class="drop" for="f"><b>Choose a video file</b><span id="fn">MP4 or WebM plays best</span></label>
    <input type="file" id="f" accept="video/*,.mkv" hidden>
    <label class="k">Playback</label>
    <div class="seg"><button id="mSync" class="on">Sync · best quality</button><button id="mStream">Stream from me</button></div>
    <p class="h" id="mHint">You both pick the same file. Only play, pause and seek are shared, so each of you sees the original quality.</p>
    <button id="mk" class="cta">Create room</button>
    <p class="msg" role="status"></p>
    <div id="hostRes" class="ticket" hidden>
      <div class="tl">Room code</div>
      <div class="code" id="short"></div>
      <div class="row"><button class="ghost" id="cp">Copy code</button><button class="ghost" id="cancel">Cancel</button></div>
      <p class="wait"><i class="pulse"></i> Waiting for your friend…</p>
    </div>
  </div>

  <div id="guestBox" hidden>
    <div id="gDrop">
      <label class="k">Video</label>
      <label class="drop" for="gf"><b>Choose the same video</b><span id="gfn">The host's file, picked from your own device</span></label>
      <input type="file" id="gf" accept="video/*,.mkv" hidden>
    </div>
    <label class="k" for="codeIn">Room code</label>
    <input type="text" id="codeIn" class="txt big" placeholder="K7M2Q" autocomplete="off" spellcheck="false" maxlength="10">
    <button id="jn" class="cta">Join room</button>
    <p class="msg" role="status"></p>
  </div>
  <div style="text-align:right;margin-top:14px"><button class="ghost" id="over" style="padding:7px 14px;font-size:.85rem">Start over</button></div>
</section>

<section>
  <div id="stage">
    <video id="v" controls playsinline></video>
    <div id="tap">Tap to play</div>
    <div id="gc" hidden><button id="bk">-10s</button><button id="pp">Pause</button><button id="fw">+10s</button><input type="range" id="sk" min="0" max="1" step="0.5" value="0" aria-label="Seek"><span id="tm">0:00 / 0:00</span></div>
    <div id="toasts" role="status" aria-live="polite"></div>
  </div>
  <input type="file" id="cf" accept="video/*,.mkv" hidden>
  <div id="bar">
    <div><div id="who">Not connected</div><div id="st">Not connected</div></div>
    <div class="row">
      <button class="ghost" id="chg">Change video</button>
      <button class="ghost" id="fs">Full screen</button>
      <button class="ghost" id="lv">Leave</button>
    </div>
  </div>
</section>
</main>
<script>
const $=id=>document.getElementById(id),v=$('v');
let pc,dc,role='host',mode='sync',busy=false,tick,lastP=true,lastT=0,drag=false,lastCmd=0,room=null,roomNS=null,inc=[],gotAns=false,peer='',gone=false;

// Room-code channel: Claude's room (signed-in viewers) or a free public PeerJS server (downloaded copy).
function loadPeer(){return new Promise((ok,no)=>{if(window.Peer)return ok();const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
const peerNS={join:name=>new Promise((res,rej)=>{
  let mine={},other=null,conn=null,pr=null,done=false;const cbs=[];
  const fin=(f,x)=>{if(!done){done=true;f(x)}};
  setTimeout(()=>fin(rej,new Error('the code server could not be reached')),8000);
  const rm={
    presence:async p=>{Object.assign(mine,p);if(conn&&conn.open)conn.send(mine)},
    peers:()=>other?[{isMe:false,presence:other}]:[],
    onPeers:f=>cbs.push(f),
    leave:async()=>{try{pr&&pr.destroy()}catch{}}
  };
  const link=c=>{if(conn)return;c.on('open',()=>{conn=c;c.send(mine)});c.on('data',d=>{other=Object.assign(other||{},d);cbs.forEach(f=>f({peers:rm.peers()}))})};
  pr=new Peer(name);
  pr.on('open',()=>{pr.on('connection',link);fin(res,rm)});
  pr.on('error',e=>{
    if(e.type==='unavailable-id'){pr.destroy();pr=new Peer();pr.on('open',()=>{link(pr.connect(name,{reliable:true}));fin(res,rm)});pr.on('error',x=>fin(rej,x))}
    else fin(rej,e);
  });
})};
const roomP=(async()=>{
  try{roomNS=window.claude&&claude.use?await claude.use('room'):null}catch{}
  if(!roomNS){try{await loadPeer();roomNS=peerNS}catch{}}
})();
const waitRoom=()=>Promise.race([roomP,new Promise(r=>setTimeout(r,5000))]);

const st=t=>{$('st').textContent=t;document.querySelectorAll('.msg').forEach(m=>m.textContent=t)};
const fmt=t=>{t=Math.max(0,t|0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const myName=()=>($('nm').value.trim()||'Guest').slice(0,20);
const who=()=>$('who').textContent=pc&&peer?'You: '+myName()+'  ·  Friend: '+peer:'Not connected';
try{$('nm').value=localStorage.getItem('wt-name')||''}catch{}
$('nm').oninput=()=>{try{localStorage.setItem('wt-name',$('nm').value)}catch{}};
function toast(t,k){
  const d=document.createElement('div');d.className='toast '+(k||'');d.textContent=t;$('toasts').appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),320)},3800);
}
const seg=(a,b,on)=>{a.classList.toggle('on',on);b.classList.toggle('on',!on)};
const mkcode=()=>Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[b%31]).join('');
async function pack(o){const s=new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('deflate-raw'));const u=new Uint8Array(await new Response(s).arrayBuffer());let t='';u.forEach(c=>t+=String.fromCharCode(c));return btoa(t)}
async function unpack(t){const u=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text())}

$('rHost').onclick=()=>{role='host';seg($('rHost'),$('rGuest'),true);$('hostBox').hidden=false;$('guestBox').hidden=true};
$('rGuest').onclick=()=>{role='guest';seg($('rHost'),$('rGuest'),false);$('hostBox').hidden=true;$('guestBox').hidden=false};
$('mSync').onclick=()=>{mode='sync';seg($('mSync'),$('mStream'),true);$('mHint').textContent="You both pick the same file. Only play, pause and seek are shared, so each of you sees the original quality."};
$('mStream').onclick=()=>{mode='stream';seg($('mSync'),$('mStream'),false);$('mHint').textContent="Your friend doesn't need the file. Your video is sent live at up to 25 Mbps, and they get play, pause and seek buttons. Needs a fast upload."};
const load=(f,lab)=>{if(f){v.srcObject=null;v.src=URL.createObjectURL(f);lab.textContent=f.name}};
$('f').onchange=e=>load(e.target.files[0],$('fn'));
$('gf').onchange=e=>load(e.target.files[0],$('gfn'));
$('chg').onclick=()=>$('cf').click();
$('cf').onchange=e=>{const f=e.target.files[0];if(!f)return;load(f,$('fn'));send({t:'file',n:f.name});toast('Video changed to '+f.name+(mode==='sync'&&dc?'. Your friend needs the same file.':''),'info');e.target.value=''};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('short').textContent);toast('Code copied','ok')}catch{toast('Select the code and copy it by hand','warn')}};

function reset(){
  clearInterval(tick);
  const oldPc=pc;
  if(dc&&dc.readyState==='open'){try{dc.send(JSON.stringify({t:'bye'}))}catch{}}
  if(pc){pc.onconnectionstatechange=null;if(dc)dc.onclose=null;setTimeout(()=>{try{oldPc.close()}catch{}},250)}
  pc=dc=null;inc=[];gotAns=false;peer='';gone=false;
  if(room){room.leave().catch(()=>{});room=null}
  if(v.srcObject){v.srcObject=null;v.removeAttribute('src');v.load()}else v.pause();
  v.controls=true;$('codeIn').value='';$('hostRes').hidden=$('gc').hidden=true;
  $('mk').hidden=false;$('chg').hidden=false;$('tap').style.display='none';$('gDrop').hidden=false;
  $('setup').hidden=false;st('Not connected');who();
}
$('over').onclick=$('cancel').onclick=$('lv').onclick=reset;

function tune(){pc.getSenders().forEach(async s=>{if(s.track&&s.track.kind==='video'){const p=s.getParameters();if(!p.encodings||!p.encodings.length)p.encodings=[{}];p.encodings[0].maxBitrate=25e6;p.degradationPreference='maintain-resolution';try{await s.setParameters(p)}catch{}}})}
function peerLeft(){if(gone)return;gone=true;toast((peer||'Your friend')+' left the room','warn');st('Your friend left the room.');peer='';who()}
function newPC(){
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});inc=[];gotAns=false;gone=false;
  pc.ontrack=e=>inc.push(e);
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    if(s==='connected'){tune();$('setup').hidden=true;if(room){room.leave().catch(()=>{});room=null}st(mode==='sync'?'Connected. Press play and you both stay in sync.':'Connected.');who()}
    if(s==='failed'){st('Connection failed. Strict networks can block direct connections. Leave and try again.');toast('Connection failed','warn')}
    if(s==='disconnected')st('Connection interrupted…');
  };
}
function route(){
  inc.forEach(e=>{
    if(e.track.kind!=='video')return;
    v.srcObject=e.streams[0]||new MediaStream([e.track]);v.controls=false;v.muted=false;
    $('tap').style.display='grid';$('tap').onclick=()=>{v.play();$('tap').style.display='none'};
    $('chg').hidden=role==='guest';$('gc').hidden=role!=='guest';
  });
}
const ice=()=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState==='complete'&&r();setTimeout(r,4000)});

const send=m=>{if(dc&&dc.readyState==='open')dc.send(JSON.stringify(m))};
function wire(){
  dc.onopen=()=>{
    send({t:'hi',n:myName(),d:v.duration||0});
    if(role==='host'&&mode==='sync')tick=setInterval(()=>!v.paused&&send({t:'tick',time:v.currentTime}),2000);
    if(role==='host'&&mode==='stream')tick=setInterval(()=>send({t:'state',time:v.currentTime,dur:v.duration||0,p:v.paused}),500);
  };
  dc.onclose=peerLeft;
  dc.onmessage=async e=>{
    const m=JSON.parse(e.data),n=peer||'Your friend';
    if(m.t==='hi'){
      peer=String(m.n||'Friend').slice(0,20);who();gone=false;
      toast(role==='host'?peer+' joined the room':"You joined "+peer+"'s room",'ok');
      if(mode==='sync'&&m.d&&v.duration&&Math.abs(m.d-v.duration)>1)toast('Your files have different lengths. Check you both picked the same one.','warn');
      return;
    }
    if(m.t==='bye'){peerLeft();return}
    if(m.t==='file'){toast(n+' changed the video to '+m.n,'info');return}
    if(m.t==='cmd'&&role==='host'&&mode==='stream'){
      try{
        if(m.a==='play'){await v.play();toast(n+' resumed the video','info')}
        else if(m.a==='pause'){v.pause();toast(n+' paused the video','info')}
        else if(m.a==='seek'){v.currentTime=Math.max(0,Math.min(m.time,v.duration||m.time));toast(n+' jumped to '+fmt(v.currentTime),'info')}
      }catch{}
      return;
    }
    if(m.t==='state'&&role==='guest'&&mode==='stream'){
      if(m.p!==lastP&&Date.now()-lastCmd>2000)toast(n+(m.p?' paused':' resumed')+' the video','info');
      lastP=m.p;lastT=m.time;$('pp').textContent=m.p?'Play':'Pause';
      if(!m.p&&v.paused)v.play().catch(()=>{});
      if(!drag){$('sk').max=m.dur||1;$('sk').value=m.time;$('tm').textContent=fmt(m.time)+' / '+fmt(m.dur)}
      return;
    }
    if(mode!=='sync')return;
    busy=true;
    try{
      if(m.t==='play'){if(Math.abs(v.currentTime-m.time)>.3)v.currentTime=m.time;await v.play();toast(n+' pressed play','info')}
      else if(m.t==='pause'){v.pause();v.currentTime=m.time;toast(n+' paused at '+fmt(m.time),'info')}
      else if(m.t==='seek'){v.currentTime=m.time;toast(n+' jumped to '+fmt(m.time),'info')}
      else if(m.t==='tick'&&!v.paused&&Math.abs(v.currentTime-m.time)>.8)v.currentTime=m.time;
    }catch{}
    setTimeout(()=>busy=false,350);
  };
}
v.addEventListener('play',()=>!busy&&mode==='sync'&&send({t:'play',time:v.currentTime}));
v.addEventListener('pause',()=>!busy&&mode==='sync'&&send({t:'pause',time:v.currentTime}));
v.addEventListener('seeked',()=>!busy&&mode==='sync'&&send({t:'seek',time:v.currentTime}));

async function applyAnswer(a){
  if(gotAns||!pc)return;gotAns=true;
  try{const o=await unpack(a);await pc.setRemoteDescription(o.d);route();st('Connecting…')}
  catch{gotAns=false;st('Could not read your friend\'s reply. Cancel and try again.')}
}
async function mkGo(){
  if(!v.src){st('Choose a video file first.');return}
  await waitRoom();
  if(!roomNS){st('Room codes are not available on this page. Open the downloaded copy of the page, or both sign in to Claude on the published one.');return}
  newPC();dc=pc.createDataChannel('sync');wire();
  if(mode==='stream'){
    try{await v.play();v.pause();v.currentTime=0}catch{}
    const s=v.captureStream?v.captureStream():v.mozCaptureStream();
    if(!s.getTracks().length){st('Could not capture this video. Try Sync mode or an MP4 (H.264) file.');return}
    for(const t of s.getTracks()){if(t.kind==='video')t.contentHint='detail';pc.addTrack(t,s)}
  }
  await pc.setLocalDescription(await pc.createOffer());
  st('Preparing your room…');await ice();
  const off=await pack({d:pc.localDescription,m:mode});
  const code=mkcode();room=await roomNS.join('wp-'+code.toLowerCase());
  await room.presence({o:off});
  room.onPeers(ch=>{const p=ch.peers.find(x=>!x.isMe&&x.presence&&x.presence.a);if(p)applyAnswer(p.presence.a)});
  $('short').textContent=code;$('hostRes').hidden=false;$('mk').hidden=true;st('Room ready. Share the code '+code+'.');
}
async function jnGo(){
  const raw=$('codeIn').value.trim();
  if(!raw){st('Enter the room code first.');return}
  await waitRoom();
  if(!roomNS){st('Room codes are not available on this page. Ask the host to open the downloaded copy with you.');return}
  room=await roomNS.join('wp-'+raw.toLowerCase().replace(/[^a-z0-9]/g,''));
  st('Looking for the room…');
  const off=await new Promise((res,rej)=>{
    const find=()=>{const p=room&&room.peers().find(x=>!x.isMe&&x.presence&&x.presence.o);if(p)res(p.presence.o)};
    find();room.onPeers(find);
    setTimeout(()=>rej(new Error('No room found for that code. Check it and try again.')),10000);
  });
  const o=await unpack(off);mode=o.m;
  if(mode==='sync'&&!v.src)throw new Error('Choose the same video file first, then join again.');
  newPC();pc.ondatachannel=e=>{dc=e.channel;wire()};
  await pc.setRemoteDescription(o.d);route();
  if(mode==='stream')$('gDrop').hidden=true;
  await pc.setLocalDescription(await pc.createAnswer());
  st('Joining…');await ice();
  await room.presence({a:await pack({d:pc.localDescription})});st('Connecting…');
}

const cmd=(a,time)=>{lastCmd=Date.now();send({t:'cmd',a,time})};
$('pp').onclick=()=>cmd(lastP?'play':'pause');
$('bk').onclick=()=>cmd('seek',lastT-10);
$('fw').onclick=()=>cmd('seek',lastT+10);
$('sk').oninput=()=>{drag=true;$('tm').textContent=fmt($('sk').value)};
$('sk').onchange=()=>{cmd('seek',+$('sk').value);setTimeout(()=>drag=false,800)};
const guard=(btn,fn)=>btn.onclick=async()=>{
  if(!window.RTCPeerConnection){st('This page blocks peer-to-peer connections. Open the downloaded copy in Chrome, Edge or Firefox.');return}
  const t=btn.textContent;btn.disabled=true;btn.textContent='Working…';
  try{await fn()}catch(e){st('Error: '+(e&&e.message||e));if(room){room.leave().catch(()=>{});room=null}}
  btn.disabled=false;btn.textContent=t;
};
guard($('mk'),mkGo);guard($('jn'),jnGo);
v.onerror=()=>st("Your browser can't play this video format. Convert it to MP4 (H.264) or WebM and pick it again.");

const stage=$('stage');
function fs(){
  if(document.fullscreenElement||stage.classList.contains('theater')){document.fullscreenElement&&document.exitFullscreen();stage.classList.remove('theater');return}
  const r=stage.requestFullscreen?stage.requestFullscreen():Promise.reject();
  r.catch(()=>stage.classList.add('theater'));
}
$('fs').onclick=fs;v.ondblclick=fs;
addEventListener('keydown',e=>{if(e.key==='Escape')stage.classList.remove('theater');if(e.key==='f'&&!/TEXTAREA|INPUT/.test(e.target.tagName))fs()});
